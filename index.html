<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어회화">
<meta name="theme-color" content="#1b2b4b">
<title>영어회화 코치 v3.1</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: white page, navy call boxes. Left = call (Julia | Jun 50:50, caption strip) + transcript + input. Right = mistakes + expression notes. Settings live in a modal. */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f4f6fa; --line:#e2e7f0; --fg:#14213d; --muted:#66708a;
  --navy:#1b2b4b; --navy-2:#24385f; --navy-3:#2f4675; --navy-fg:#eef2fa;
  --accent:#1f4b99; --accent-soft:#eaf0fa; --good:#1a7f37; --good-soft:#e8f5ec; --warn:#b45309; --warn-soft:#fdf3e7;
  --coach:#1f4b99; --coach-soft:#eef3fb; --speak:#4ade80;
  --coral:#e8513f; --coral-deep:#c43a2a; --coral-soft:#fdebe7; --coral-line:#f5cbc2; --coral-pale:#fff5f2;
  --f-display:"Montserrat","Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --f-en:"Montserrat","Pretendard Variable","Pretendard",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:12px}
html{height:100%;overflow:hidden}
body{position:fixed;left:0;right:0;top:0;height:var(--appH,100dvh);overflow:hidden;overscroll-behavior:none}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr);gap:12px;height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--navy)}
.sub{color:var(--muted);font-size:13px;flex:1;min-width:0}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 13px;font-size:12.5px;white-space:nowrap}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
button.primary:hover{background:var(--navy-3);color:#fff}
.gear{display:flex;align-items:center;gap:6px;font-weight:600}

/* Call */
.call{background:var(--navy);padding:10px;display:flex;flex-direction:column;gap:10px;flex:none}
.callbar{display:flex;align-items:center;gap:10px;color:var(--navy-fg);font-size:12.5px;padding:0 4px;flex-wrap:nowrap;overflow-x:auto}
.rec{width:8px;height:8px;border-radius:50%;background:#ff5a5f;flex:none}
.callbar .t{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600;min-width:42px}
.callbar .topic{white-space:nowrap;min-width:0}
.callbar .sp{flex:1}
.callbar button{background:var(--navy-2);color:var(--navy-fg);border-color:transparent;flex:none}
.callbar button.fixed{min-width:108px;text-align:center}
.callbar button.primary{background:#fff;color:var(--navy)}
.coachPill{display:flex;align-items:center;gap:6px;background:var(--navy-3);border-radius:999px;padding:3px 10px;font-weight:600;white-space:nowrap;visibility:hidden}
.coachPill.on{visibility:visible}
.tiles{display:grid;grid-template-columns:repeat(2,min(calc((100% - 10px)/2),calc(30vh*1.19),360px));justify-content:center;gap:10px;position:relative}
.tile{position:relative;border-radius:12px;overflow:hidden;background:var(--navy-2);color:var(--navy-fg);height:auto;aspect-ratio:1.19/1;width:100%}
.tile::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 0 var(--speak);transition:box-shadow .15s;pointer-events:none}
.tile.speaking::after{box-shadow:inset 0 0 0 3px var(--speak)}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile img.fit{object-fit:cover;object-position:center top}
.tile img.bgblur{display:none}
.tile video{transform:scaleX(-1)}
.tile.speaking img.nobreathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012) translateY(-2px)}}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ph svg{width:min(48%,200px);height:auto}
.initial{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:28px;color:#fff;background:var(--navy-3)}
.name{position:absolute;left:10px;top:10px;background:rgba(10,20,40,.6);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;display:flex;align-items:center;gap:6px;z-index:2}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.bars i{width:3px;height:3px;background:var(--speak);border-radius:1px}
.speaking .bars i,.coachPill.on .bars i{animation:bar .5s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.15s!important}.bars i:nth-child(3){animation-delay:.3s!important}
@keyframes bar{from{height:3px}to{height:11px}}
.cap{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(94%,820px);z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px 8px;color:#fff}
.cap .who{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a9c1ff}
.cap>span{background:rgba(10,20,40,.72);border-radius:8px;padding:3px 12px}
.cap .who{background:none!important;padding:0!important}
.cap .en{font-family:var(--f-en);font-weight:600;font-size:clamp(14px,1.5vw,18px);line-height:1.4}
.cap .kr{font-size:15px;line-height:1.45}
.cap .ko{font-size:13px;color:#c9d3e8}

/* Transcript */
.log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;background:var(--surface)}
.row{display:flex;flex-direction:column;gap:2px;max-width:min(760px,92%)}
.row.me{align-self:flex-end;align-items:flex-end}
.who-l{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.bubble{padding:8px 13px;border-radius:15px;font-family:var(--f-en);font-weight:500;font-size:14.5px;line-height:1.5;word-break:break-word}
.me .bubble{background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.me.rep .bubble{background:var(--accent-soft);color:var(--fg)}
.okmark{font-size:11.5px;color:var(--good);font-weight:600}
.julia .bubble{background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:5px}
.small{font-size:12px;color:var(--muted);padding-inline:4px}
.coach{align-self:stretch;max-width:860px;background:var(--coach-soft);border:1px solid #d9e3f4;border-radius:12px;padding:10px 13px;display:flex;flex-direction:column;gap:5px}
.coach .lbl{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coach)}
.coach .say{font-size:14px}
.coach .model{font-family:var(--f-en);font-weight:700;font-size:17px;line-height:1.4;color:var(--navy)}
.coach .model ins{text-decoration:none;color:var(--accent);border-bottom:2px solid var(--accent)}
.coach.good{background:var(--good-soft);border-color:#cfe9d6} .coach.good .lbl{color:var(--good)}
.coach.review{background:var(--warn-soft);border-color:#f3d2a8} .coach.review .lbl{color:var(--warn)}
.coach.teach .model{font-size:15px;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.thinking{color:var(--muted);font-size:13px}
.err{color:var(--warn);font-size:13px}
.target{margin:0 14px;padding:8px 12px;border-radius:10px;background:var(--coach-soft);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.target b{font-family:var(--f-en);font-size:14.5px;color:var(--navy)}
.compose{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;font:inherit;font-family:var(--f-en);font-weight:500;font-size:15px;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:12px;padding:10px 12px;min-height:46px;max-height:120px}
.send{padding:11px 20px;font-size:14px}
.mic{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:14px;font-weight:700}
.micdot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.mic.recording{background:#e5484d;border-color:#e5484d;color:#fff}
.mic.recording .micdot{background:#fff;animation:pulse 1s ease-in-out infinite}
.mic.busy{opacity:.6}
@keyframes pulse{50%{opacity:.3}}
.hint{padding:0 14px 10px;color:var(--muted);font-size:12px}

/* Side */
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0;flex:1;min-height:0}
.sec h2{font-family:var(--f-display);font-size:13px;font-weight:700;margin:0;letter-spacing:.02em;color:var(--navy)}
.pat{display:flex;flex-direction:column;gap:8px}
.p{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.p .n{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--warn)}
.p .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.p .bar i{display:block;height:100%;background:var(--warn)}
.p .ex{grid-column:1/-1;color:var(--muted);font-size:12px;font-family:var(--f-en)}
.notes{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:120px;flex:1}
.note{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.note .w{color:var(--muted);font-family:var(--f-en);text-decoration:line-through;text-decoration-color:#c5ccd9}
.note .r{color:var(--navy);font-weight:700;font-family:var(--f-en)}
.note .why{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px}
.side-head{display:none!important}
.only-m{display:none}
.pron{align-self:flex-end;max-width:min(560px,92%);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:6px}
.ph-row{display:flex;align-items:baseline;gap:4px}
.ph-row .score{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.ph-row .unit{font-size:13px;color:var(--muted);margin-right:8px}
.ph-row .grade{font-size:12.5px;color:var(--muted)}
.pron .words{font-family:var(--f-en);font-weight:600;font-size:15px;line-height:1.8}
.pw{padding:1px 4px;border-radius:5px}
.pw.g{background:var(--good-soft);color:var(--good)}
.pw.m{background:var(--warn-soft);color:var(--warn)}
.pw.b{background:#fde8e8;color:#c0262d;text-decoration:underline wavy #e5484d}
.legend{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px}
.legend i.g{background:var(--good)}.legend i.m{background:var(--warn)}.legend i.b{background:#e5484d}
.clar{font-size:11.5px;color:var(--muted)}

/* Settings modal */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow-y:auto}
.sheet{background:var(--surface);border-radius:16px;width:min(560px,100%);box-shadow:0 20px 50px rgba(15,25,45,.25);display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:16px;color:var(--navy)}
.sheet .sec:last-child{flex:none}
label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select,input[type=password],input[type=text]{font:inherit;font-size:13.5px;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=range]{width:100%;accent-color:var(--navy)}
.tip{font-size:12px;color:var(--muted)}
.tip.ok{color:var(--good)} .tip.bad{color:var(--warn)}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.adv{display:flex;flex-direction:column;gap:8px;padding-top:8px}

@media (max-width:900px){
  body{padding-block:8px;padding-inline:10px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px}
  .only-m{display:flex}
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0;z-index:40;border-radius:0;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
  .side.open .side-head{display:flex!important;flex-direction:row;justify-content:space-between;align-items:center}
  .call{padding:8px;gap:8px}
  .tile{height:auto}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{height:auto}
  body.kb header{display:none}
  body.kb .callbar{display:none}
  body.kb .tile{height:clamp(70px,13vh,96px);aspect-ratio:auto}
  body.kb .cap{display:none}
  body.kb .app{grid-template-rows:minmax(0,1fr)}
  body.kb .tile img.face{object-position:center 42%}
  body.kb .compose{grid-template-areas:"t t s";grid-template-columns:1fr 1fr 76px}
  body.kb .compose .mic,body.kb .compose .autob{display:none}
  body.kb .log{min-height:120px}
  body.kb .call{padding:6px}
  .cap{bottom:8px}
  .cap .en,.cap .kr{font-size:13px}
  .hint{display:none}
  .initial{width:56px;height:56px;font-size:20px}
  .compose{padding:8px 10px;gap:8px;align-items:stretch}
  .compose textarea{min-height:44px;font-size:16px}
  .autob,.mic{padding:8px 10px;font-size:12.5px}
  .mic{padding:8px 12px;font-size:13px}.send{padding:8px 14px;font-size:13px}
  .callbar{flex-wrap:wrap;overflow:visible;row-gap:8px}
  .callbar .sp{flex-basis:100%;height:0}
  .callbar button.fixed{min-width:0;flex:1 1 0;padding-inline:4px}
  .sub{display:none}
  header h1{flex:1}
}
@media (prefers-reduced-motion:reduce){.tile.speaking img,.bars i{animation:none!important}}


/* Coral accent: only where attention should go */
.mic{background:var(--coral);border-color:var(--coral);color:#fff}
.mic:hover{background:var(--coral-deep);border-color:var(--coral-deep);color:#fff}
.mic .micdot{background:#fff}
.mic.recording{background:var(--navy);border-color:var(--navy)}
.ph-row .score{color:var(--coral-deep)}
.coachPill{background:var(--coral)!important;color:#fff}
.coachPill .bars i{background:#fff}
.coach .lbl{color:var(--coral-deep)}
.coach.good .lbl{color:var(--good)} .coach.review .lbl{color:var(--warn)}
.coach .model ins{color:var(--coral-deep);border-bottom-color:var(--coral)}
.target{background:var(--coral-soft)}
.target b{color:var(--coral-deep)}
.rec{background:var(--coral)}
.callbar button.primary{color:var(--coral-deep)}
.julia .bubble{background:#d8e6fd;border:1.5px solid #a9c4f0;color:#0f1d3a;font-weight:600}
.coach{background:var(--coral-pale);border-color:var(--coral-line)}
.coach.teach{background:var(--coral-pale);border-color:var(--coral-line)}
.me.rep .bubble{background:var(--coral-soft);color:var(--fg)}
.pron{background:var(--coral-pale);border-color:var(--coral-line)}
.cap .who{color:#ff9c84}
.p .n{color:var(--coral-deep)} .p .bar i{background:var(--coral)}

.autob{display:flex;align-items:center;gap:7px;padding:11px 14px;font-size:13.5px;font-weight:700;border-color:var(--coral-line);color:var(--coral-deep);background:#fff}
.autodot{width:9px;height:9px;border-radius:50%;border:2px solid var(--coral)}
.autob.on{background:var(--coral-soft);border-color:var(--coral)}
.autob.on .autodot{background:var(--coral);animation:pulse 1.4s ease-in-out infinite}
textarea{font-size:16px}

@media (max-width:900px){
  .compose{display:grid;grid-template-columns:1fr 1fr 76px;grid-template-areas:"t t s" "m a s";gap:6px;padding:8px 10px}
  .compose textarea{grid-area:t;min-height:40px;padding:8px 10px}
  .compose .mic{grid-area:m;justify-content:center;padding:7px 8px}
  .compose .autob{grid-area:a;justify-content:center;padding:7px 8px}
  .compose .send{grid-area:s;padding:0;border-radius:14px}
  .target{margin:0 10px;padding:6px 10px;gap:6px}
  .target b{font-size:14px}
  .target button{padding:4px 10px}
}
textarea{height:44px}
textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){.compose textarea{height:40px;min-height:40px}}
.rep-tag{font-size:12.5px;font-weight:700;color:var(--coral-deep);align-self:center;margin-right:4px}
.ver{font-family:var(--f-display);font-size:11px;font-weight:600;color:var(--muted);margin-left:6px}
.ver-h{font-family:var(--f-display);font-weight:500;font-size:13px;color:#a7b0c2;letter-spacing:0}

/* Captions sit in their own strip under the photos so they never cover faces */
.cap{position:static!important;transform:none!important;width:auto!important;min-height:42px;padding:2px 8px!important;gap:1px!important;overflow:visible;pointer-events:auto}
.cap>span{background:none!important;padding:0!important;border-radius:0}
.cap .en{font-size:clamp(14px,1.4vw,17px)!important;display:block;overflow:visible;white-space:normal;overflow-wrap:anywhere}
.cap .kr{font-size:14px!important;display:block;overflow:visible;white-space:normal;overflow-wrap:anywhere}
.cap .ko{font-size:12px!important}
@media (max-width:900px){.cap{min-height:36px}.cap .en,.cap .kr{font-size:13px!important}}
.tile img.face{transition:opacity .45s ease;object-position:center top}
#juliaPhoto2{opacity:0}
.tile.custom img.face{object-position:center top}
@media (max-width:900px){header{gap:6px}header .gear{padding:6px 10px;font-size:12px}}
.pane.side{overflow-y:auto}
.log{min-height:96px}

/* v2.3 UI */
.ver-h{display:inline-block;vertical-align:middle;font-family:var(--f-display);font-weight:600;font-size:12px;color:var(--accent);background:#eaf0fa;border:1px solid #d3def1;border-radius:7px;padding:1px 7px;margin-left:4px;letter-spacing:0}
.callbar{position:relative}
.callbar .sp{flex:1 1 auto!important;flex-basis:auto!important;height:auto!important}
.more{background:transparent!important;border:0!important;color:var(--navy-fg)!important;font-size:22px;line-height:1;padding:0 6px!important;min-width:34px}
.menu{position:absolute;right:4px;top:30px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,25,45,.18);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:140px}
.menu button{background:transparent!important;color:var(--fg)!important;border:0!important;text-align:left;border-radius:8px;padding:9px 12px;font-size:13.5px}
.menu button:hover{background:var(--soft)!important}
.menu button:disabled{opacity:.4}
.bubble.jb{display:flex;align-items:flex-start;gap:10px}
.bubble.jb .jt{flex:1;min-width:0}

<body>
<div class="app">

class ApiError extends Error{}
async function api(path,opts){

  const res=await fetch("https://api.openai.com/v1/"+path,{...opts,headers:{Authorization:"Bearer "+cfg.key,...(opts.headers||{})}});
  if(!res.ok){
    let m=""; try{const j=await res.json();m=j.error&&j.error.message||""}catch(e){}
    if(res.status===401)throw new ApiError("API 키가 맞지 않아요. 설정에서 키를 다시 확인해 주세요.");
    if(res.status===429)throw new ApiError("크레딧이 부족하거나 요청이 많아요. OpenAI 결제 화면에서 잔액을 확인해 주세요. ("+m+")");
    throw new ApiError("OpenAI 오류 "+res.status+": "+m);
  }
  return res;
}

  const post=()=>api("chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

  try{res=await post()}catch(e){if(body.reasoning_effort&&/reasoning/i.test(e.message)){delete body.reasoning_effort;res=await post()}else throw e}

  try{return JSON.parse(txt)}catch(e){const m=txt.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw new ApiError("답을 읽지 못했어요. 한 번 더 보내주세요.")}

function tts(text,who){

async function transcribe(blob){
  const fd=new FormData();
  const ext=/mp4|m4a|aac/.test(blob.type)?"mp4":/ogg/.test(blob.type)?"ogg":/wav/.test(blob.type)?"wav":"webm";
  fd.append("file",blob,"speech."+ext); fd.append("model",cfg.stt);
  fd.append("prompt","A Korean adult practicing English conversation on a video call. Mostly English with a Korean accent, sometimes Korean words or full Korean sentences. Write English words in English and Korean words in Hangul. Keep his grammar mistakes exactly as spoken.");
  const wantProbs=!/whisper/.test(cfg.stt);
  if(wantProbs){fd.append("response_format","json");fd.append("include[]","logprobs")}
  let r;
  try{r=await api("audio/transcriptions",{method:"POST",body:fd})}
  catch(e){if(wantProbs&&/logprob|include/i.test(e.message)){fd.delete("include[]");r=await api("audio/transcriptions",{method:"POST",body:fd})}else throw e}
  const j=await r.json();

}
// tokens -> [{w, p}] where p is the lowest token confidence inside the word
function wordsFromLogprobs(lp){
  if(!Array.isArray(lp)||!lp.length)return [];
  const out=[]; let cur=null;
  lp.forEach(t=>{
    const tok=String(t.token||""); const p=Math.exp(Number(t.logprob)||0);
    const startsNew=!cur||/^\s/.test(tok);
    const piece=tok.replace(/^\s+/,"");
    if(startsNew){if(cur&&cur.raw)out.push(cur);cur={raw:piece,p}}
    else{cur.raw+=piece;cur.p=Math.min(cur.p,p)}
  });
  if(cur&&cur.raw)out.push(cur);
  return out.map(x=>({w:norm(x.raw)[0]||"",p:x.p,raw:x.raw})).filter(x=>x.w);
}
/* Pronunciation score: align the target sentence with what the recognizer heard */
function scorePron(target,heard,words){
  const T=norm(target);
  const S=words&&words.length?words:norm(heard).map(w=>({w,p:1}));
  const n=T.length,m=S.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=T[i]===S[j].w?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const res=T.map(w=>({w,score:0,heard:false}));
  let i=0,j=0;
  while(i<n&&j<m){if(T[i]===S[j].w){const p=S[j].p;res[i].heard=true;res[i].score=Math.round(Math.max(0,Math.min(1,(p-0.35)/0.55))*100);i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const total=res.length?Math.round(res.reduce((a,r)=>a+r.score,0)/res.length):0;
  return {total,res,weak:res.filter(r=>r.score<60).map(r=>r.w),hasConf:!!(words&&words.length)};
}

const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
function highlightModel(said,model){
  if(hasKo(said))return esc(model);
  const saidSet=new Set(norm(said));
  return model.split(/(\s+)/).map(tok=>{const w=norm(tok)[0];return w&&!saidSet.has(w)?`<ins>${esc(tok)}</ins>`:esc(tok)}).join("");
}
function similarity(a,b){
  const x=norm(a),y=norm(b); if(!y.length)return 0;
  const d=Array.from({length:x.length+1},(_,i)=>[i]);
  for(let j=1;j<=y.length;j++)d[0][j]=j;
  for(let i=1;i<=x.length;i++)for(let j=1;j<=y.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(x[i-1]===y[j-1]?0:1));
  return 1-d[x.length][y.length]/Math.max(x.length,y.length);
}

Reply with ONLY this JSON object (always include "emotion"):
{"emotion":"see the emotion rules below","intent":"answer" or "question",

"reply_ko":"natural casual Korean subtitle of Julia's line",
"emotion":"Julia's facial expression while saying her line, exactly one of: calm, joy, happy, sad, empathy, sorry, surprised, angry, anxious, pondering, thoughtful, shy, charmed, relieved, lonely, love. Vary it like a real person reacting on camera: joy for playful or teasing moments, happy for good news or excitement, empathy when Jun shares a feeling or a hard day, sorry for bad luck, sad for sad news, surprised for unexpected things, anxious when something sounds stressful, pondering when she is curious or asks something thoughtful, thoughtful for reflective moments, shy when complimented, charmed when she is enjoying a fun or interesting story, empathy (a warm understanding smile) when encouraging Jun, relieved when things turned out fine, lonely when talking about missing someone, love for sweet or warm moments, angry only when something is clearly unfair. Use calm only for plain neutral small talk. Her previous expression was ${lastEmo}; real faces change with the mood, so pick a different one whenever the feeling of her new line is different."}
mistakes: real English errors only (empty if perfect, if intent is question, and when mode is ko). Reuse these existing labels when they fit: ${labels.length?labels.join(", "):"(none yet)"}. Typical labels: 과거형 시제, 현재완료, 관사 a/the, 전치사, 복수형, 주어 동사 일치, 동사 형태, 단어 선택, 어순, 콩글리시/직역.
Korean strings: natural 해요체 (Julia's subtitle may be casual 반말 like a friend), never 하십시오체, never the middle dot character, never 「」, never circled numbers.`;
}

/* ---------- Flow ---------- */
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
let lastEmo="calm", sameCount=0;
function guessEmotion(t){
  t=String(t||"").toLowerCase();
  const rules=[["love",/\b(love|sweet|adorable|so cute|aww+)\b/],["joy",/\b(haha+|lol|funny|hilarious|kidding|joking)\b/],["surprised",/\b(no way|wow|whoa|really\?|seriously|what\?!?|oh my god|omg)\b/],["sorry",/\b(oh no|that's awful|that sucks|i'm so sorry|bummer|ugh)\b/],["sad",/\b(sad|miss (you|her|him|them)|lonely|cry)\b/],["anxious",/\b(nervous|stress|worried|scary|anxious)\b/],["relieved",/\b(phew|glad (it|that)|thank goodness|relieved)\b/],["happy",/\b(awesome|amazing|great|congrats|congratulations|so fun|exciting|yay|nice)\b/],["shy",/\b(thank you so much|you're too kind|stop it|blush)\b/],["pondering",/\b(hmm|i wonder|curious|let me think)\b/],["empathy",/\b(i get (it|that)|i feel (you|that)|totally understand|makes sense)\b/]];
  for(const [k,re] of rules)if(re.test(t))return k;
  return null;
}
function pickEmotion(emo,text){
  let e=EMO[emo]?emo:null; const g=guessEmotion(text);
  if(!e||e==="calm")e=g||e||"charmed";
  else if(g&&["happy","charmed","empathy","joy"].includes(e)&&g!==e)e=g;
  if(e===lastEmo){sameCount++; if(sameCount>=1&&g&&g!==e)e=g; else if(sameCount>=2)e=["charmed","empathy","joy","happy"].find(x=>x!==lastEmo)}
  else sameCount=0;
  lastEmo=e; return e;
}
async function juliaSay(en,ko,emo){
  turns.push({role:"assistant",content:en});
  const fe=pickEmotion(emo,en);
  lastJulia={en,ko}; addJulia(en,ko,fe); setPhase("answer");
  setEmotion(fe);
  await chained([{text:en,ko,who:"julia"}]);
  restEmotion(1800);
}
function startTalk(silent){
  if(!cfg.key){openSettings();$("keyState").className="tip bad";$("keyState").textContent="이 화면에는 아직 API 키가 없어요. 홈 화면 앱은 Safari와 저장 공간이 따로라서 처음 한 번 다시 넣어야 해요. 붙여넣으면 바로 저장되고, 닫기를 누른 뒤 다시 보내면 돼요.";$("apiKey").focus();return false}
  stopAudio();
  turns=[]; log.innerHTML=""; pending=null; tries=0;
  $("topicName").textContent=TOPIC_NAME[$("topic").value];
  t0=Date.now(); clearInterval(timerId); timerId=setInterval(tick,1000); tick();
  const [en,ko]=OPENERS[$("topic").value];
  if(silent){turns.push({role:"assistant",content:en});lastJulia={en,ko};addJulia(en,ko,"happy");setPhase("answer");caption({text:en,ko,who:"julia"})}
  else juliaSay(en,ko,"happy");
  return true;
}
function coachSeq(r){
  return [{text:"이렇게 말해보세요.",who:"coach"},{text:r.model,who:"coach"},{text:r.coach_point,who:"coach"}];
}
function recordMistakes(r,said){
  let review=null;
  (r.mistakes||[]).forEach(m=>{
    if(!m||!m.label)return;
    const k=clean(m.label).trim(); if(!k)return;
    const p=patterns[k]||{n:0};
    p.n++; if(m.tip_ko)p.tipKo=clean(m.tip_ko); if(m.from&&m.to)p.ex={from:m.from,to:m.to};
    patterns[k]=p;
    if(REVIEW_AT.includes(p.n)&&(!review||p.n>review.n))review={label:k,...p};
  });
  if(!r.perfect&&r.model&&!notes.some(n=>n.said===said&&n.model===r.model))notes.push({said,model:r.model,why:r.coach_point||""});
  notes=notes.slice(-80);
  store("oc_patterns",patterns); store("oc_notes",notes); renderSide();
  return review;
}
async function continueTalk(){
  const r=pending; pending=null; tries=0;
  if(!r){setPhase("answer");return}
  if(r._review){
    const v=r._review;
    const say=`${v.label} 부분을 ${v.n}번 틀렸어요.`;
    const parts=[{text:say,who:"coach"},{text:v.tipKo,who:"coach"}];
    addCoach({kind:"review",say,model:v.ex?`${esc(v.ex.from)} → <ins>${esc(v.ex.to)}</ins>`:"",point:v.tipKo,listen:parts});
    await chained(parts);
  }
  await juliaSay(r.reply,r.reply_ko,r.emotion);
}
const looksLikeQuestion=t=>hasKo(t)||/\?\s*$/.test(t)||/^(why|what|how|can i|is it|does|do you|which|when should)\b/i.test(t.trim());
async function askAI(text,ctx){
  const wait=document.createElement("div"); wait.className="thinking"; wait.textContent="듣고 있어요...";
  log.append(wait); scroll();
  busy=true; lockUI();
  turns.push({role:"user",content:text});
  try{
    const r=await chatJSON([{role:"system",content:rules(ctx)},...turns.slice(-16)]);
    wait.remove();
    if(!r||typeof r!=="object"||!r.reply)throw new ApiError("답을 읽지 못했어요. 한 번 더 보내주세요.");
    r.intent=r.intent==="question"?"question":"answer";
    if(r.intent==="answer"&&!r.model)throw new ApiError("답을 읽지 못했어요. 한 번 더 보내주세요.");
    return r;
  }catch(e){
    turns.pop(); setEmotion("calm"); wait.className="err"; wait.textContent=e instanceof ApiError?e.message:"인터넷 연결을 확인하고 다시 보내주세요.";
    msg.value=text; autosize(); return null;
  }finally{busy=false;lockUI()}
}
function markClarity(row,words){
  const weak=words.filter(w=>w.p<0.6);
  const avg=Math.round(words.reduce((a,w)=>a+Math.max(0,Math.min(1,(w.p-0.35)/0.55)),0)/words.length*100);
  const m=document.createElement("span"); m.className="clar";
  m.textContent=`발음 또렷함 ${avg}점`+(weak.length?` / 약했던 단어: ${weak.slice(0,4).map(w=>w.raw).join(", ")}`:"");
  row.append(m); savePron(avg);
}
let pronHist=load("oc_pron",[]);
function savePron(v){pronHist.push(v);pronHist=pronHist.slice(-50);store("oc_pron",pronHist);renderSide()}
function markupDiff(said,model){
  const A=said.split(/\s+/).filter(Boolean), B=model.split(/\s+/).filter(Boolean);
  const a=A.map(w=>norm(w)[0]||w.toLowerCase()), b=B.map(w=>norm(w)[0]||w.toLowerCase());
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0,dels=[],adds=[];
  const flush=()=>{if(dels.length)out.push(`<s>${dels.map(esc).join(" ")}</s>`);if(adds.length)out.push(`<ins>${adds.map(esc).join(" ")}</ins>`);dels=[];adds=[]};
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){flush();out.push(esc(B[j]));i++;j++}
    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){adds.push(B[j]);j++}
    else{dels.push(A[i]);i++}
  }
  flush();
  return out.join(" ");
}
function showTeach(r){
  const ex=Array.isArray(r.teach_examples)?r.teach_examples.filter(Boolean).slice(0,3):[];
  const parts=[{text:r.teach,who:"coach"}];
  addCoach({kind:"teach",say:r.teach,model:ex.map(esc).join("<br>"),listen:parts});
  return parts;
}

async function send(textIn,audio){
  const text=(textIn??msg.value).trim(); if(!text||busy||chain)return;
  if(phase==="idle"&&!startTalk(true))return;
  msg.value=""; autosize(); stopAudio();

  if(phase==="repeat"&&pending){
    const sim=hasKo(text)?0:similarity(text,pending.model);
    if(sim<0.75&&looksLikeQuestion(text)){
      addMe(text,false);
      const r=await askAI(text,`Right now Jun is practicing saying this sentence after Sam: "${pending.model}". If he asks about it, explain it.`);
      if(!r)return;
      if(r.intent==="question"){
        turns.push({role:"assistant",content:"(Sam answered) "+r.teach});
        const parts=showTeach(r);
        await chained([...parts,{text:"자, 이제 한번 말해볼까요?",who:"coach"},{text:pending.model,who:"coach"}]);
        return;
      }
      turns.pop();
    }else addMe(text,true);
    let pron=null;
    if(audio&&!hasKo(text)){pron=scorePron(pending.model,text,audio.words);pronCard(pron,pending.model);savePron(pron.total)}
    if(sim>=0.75){
      const g=GOOD[Math.floor(Math.random()*GOOD.length)];
      const parts=[{text:g,who:"coach"}];
      if(pron&&pron.hasConf&&pron.weak.length){
        const w=pron.weak.slice(0,3).join(", ");
        parts.push({text:`다만 ${w} 발음이 조금 약했어요. 한 번 들어볼게요.`,who:"coach"},{text:pron.weak.slice(0,3).join(". ")+".",who:"coach"});
      }
      addCoach({kind:"good",say:parts.slice(0,2).map(p=>p.text).join(" ")}); setPhase("answer");
      await chained(parts); await continueTalk();
    }else if(++tries<2){
      const say="음, 거의 다 왔어요! 한 번 더 듣고 따라 해봐요.";
      addCoach({say,model:highlightModel(text,pending.model)});
      await chained([{text:say,who:"coach"},{text:pending.model,who:"coach"}]);
    }else{
      const say="괜찮아요! 표현 노트에 저장해뒀어요. 대화 계속 이어가요.";
      addCoach({say}); setPhase("answer");
      await chained([{text:say,who:"coach"}]); await continueTalk();
    }
    return;
  }

  const meRow=addMe(text,false);
  if(audio&&audio.words&&audio.words.length&&!hasKo(text))markClarity(meRow,audio.words);
  const r=await askAI(text,"");
  if(!r){meRow.remove();return}
  if(r.intent==="question"){
    turns.pop(); turns.push({role:"user",content:"(asked the teacher) "+text});
    const parts=showTeach(r);
    if(voiceOn)tts(r.reply,"julia").catch(()=>{});
    await chained(parts);
    await juliaSay(r.reply,r.reply_ko,r.emotion);
    return;
  }
  r.mistakes=Array.isArray(r.mistakes)?r.mistakes:[];
  if(hasKo(text)){r.mode="ko";r.perfect=false;r.mistakes=[]}
  r._review=recordMistakes(r,text);
  pending=r; tries=0;
  if(voiceOn)tts(r.reply,"julia").catch(()=>{});
  if(r.perfect){
    const m=document.createElement("span"); m.className="okmark"; m.textContent="자연스러운 문장이에요"; meRow.append(m);
    await continueTalk();
  }else{
    const seq=coachSeq(r);
    if(r.mode!=="ko"){const bb=meRow.querySelector(".bubble");bb.innerHTML=markupDiff(text,r.model);meRow.classList.add("marked")}
    addCoach({say:seq[0].text,model:highlightModel(text,r.model),point:r.coach_point,listen:seq});
    await chained(seq); await continueTalk();
  }
}

/* ---------- Mic ---------- */
let recorder=null, recording=false, chunks=[], micStream=null, recStart=0;
const MIC_OPTS={audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}};
async function getMic(){
  if(micStream&&micStream.getAudioTracks().some(t=>t.readyState==="live"))return micStream;
  micStream=await navigator.mediaDevices.getUserMedia(MIC_OPTS); return micStream;
}
function recType(){return ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac","audio/ogg"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||""}
async function toggleMic(){
  if(recording){
    // keep listening a moment so the last word is not cut off
    $("micLabel").textContent="마무리 중..."; $("micBtn").disabled=true;
    setTimeout(()=>{try{recorder.stop()}catch(e){}},350); return;
  }
  if(busy||chain)return;
  if(!cfg.key){startTalk();return}
  let stream;
  try{stream=await getMic()}catch(e){toast("마이크를 쓸 수 없어요. 아이폰 설정 > Safari > 마이크(또는 주소창의 aA > 웹사이트 설정)에서 허용해 주세요.");return}
  stopAudio();
  const type=recType();
  try{recorder=new MediaRecorder(stream,type?{mimeType:type,audioBitsPerSecond:64000}:undefined)}catch(e){recorder=new MediaRecorder(stream)}
  chunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onstop=async()=>{
    recording=false; $("micBtn").disabled=false; if(msg.dataset.ph)msg.placeholder=msg.dataset.ph;
    $("micBtn").classList.remove("recording"); $("junTile").classList.remove("speaking");
    const secs=(performance.now()-recStart)/1000;
    const blob=new Blob(chunks,{type:recorder.mimeType||type||"audio/webm"});
    if(secs<0.8||blob.size<1000){$("micLabel").textContent="말하기";toast("녹음이 너무 짧았어요. 말하기를 누르고 말한 다음, 다 말하고 다시 눌러주세요.");lockUI();return}
    $("micLabel").textContent="듣는 중..."; $("micBtn").classList.add("busy");
    try{const t=await transcribe(blob); if(t.text&&!NOISE.test(t.text.trim()))await send(t.text,t); else toast("말소리가 잘 안 들렸어요. 휴대폰을 입 가까이 대고 다시 말해보세요.")}
    catch(e){toast(e instanceof ApiError?e.message:"받아쓰기에 실패했어요. 다시 말해보세요.")}
    finally{$("micLabel").textContent="말하기";$("micBtn").classList.remove("busy");lockUI()}
  };
  recorder.start(250); recording=true; recStart=performance.now();
  $("micBtn").classList.add("recording"); $("micLabel").textContent="다 말했어요"; msg.dataset.ph=msg.placeholder; msg.placeholder="듣고 있어요. 다 말하면 마이크를 다시 누르세요"; $("junTile").classList.add("speaking");
}

/* ---------- Auto listen: mic stays on, only speech is sent ---------- */
const auto={on:false,stream:null,ctx:null,an:null,buf:null,rec:null,chunks:[],speaking:false,speechMs:0,silenceMs:0,startedAt:0,raf:0,floor:0.01,type:"",last:0};
let autoSending=false;
const NOISE=/^(thank you|thanks|thanks for watching|you|bye|okay|uh|um|hmm)[.!]?$/i;
function autoUI(){
  $("autoBtn").classList.toggle("on",auto.on);
  $("autoLabel").textContent=auto.on?"자동 듣기 켜짐":"자동 듣기";
  $("autoBtn").setAttribute("aria-pressed",auto.on);
  lockUI();
}
async function toggleAuto(){
  if(auto.on){stopAuto();return}
  if(!cfg.key){startTalk();return}
  try{auto.stream=await navigator.mediaDevices.getUserMedia(MIC_OPTS)}
  catch(e){toast("마이크를 쓸 수 없어요. 브라우저 주소창의 마이크 권한을 허용해 주세요.");return}
  auto.ctx=new (window.AudioContext||window.webkitAudioContext)();
  try{await auto.ctx.resume()}catch(e){}
  const src=auto.ctx.createMediaStreamSource(auto.stream);
  auto.an=auto.ctx.createAnalyser(); auto.an.fftSize=1024; src.connect(auto.an);
  auto.buf=new Float32Array(auto.an.fftSize);
  auto.type=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  auto.on=true; auto.floor=0.01; auto.last=0; autoUI();
  if(phase==="idle")startTalk();
  auto.raf=requestAnimationFrame(autoLoop);
}
function stopAuto(){
  auto.on=false; cancelAnimationFrame(auto.raf); autoDiscard();
  if(auto.stream)auto.stream.getTracks().forEach(t=>t.stop()); auto.stream=null;
  if(auto.ctx)try{auto.ctx.close()}catch(e){} auto.ctx=null;
  $("junTile").classList.remove("speaking"); autoUI();
}
function autoLevel(){auto.an.getFloatTimeDomainData(auto.buf);let s=0;for(let i=0;i<auto.buf.length;i++)s+=auto.buf[i]*auto.buf[i];return Math.sqrt(s/auto.buf.length)}
function autoStartSeg(){
  auto.chunks=[];
  auto.rec=new MediaRecorder(auto.stream,auto.type?{mimeType:auto.type}:undefined);
  auto.rec.ondataavailable=e=>{if(e.data&&e.data.size)auto.chunks.push(e.data)};
  auto.rec.start(); auto.startedAt=performance.now(); auto.speaking=false; auto.speechMs=0; auto.silenceMs=0;
}
function autoDiscard(){const r=auto.rec;auto.rec=null;auto.speaking=false;if(r){r.onstop=null;try{r.stop()}catch(e){}}}
function autoFinish(){
  const r=auto.rec; auto.rec=null; auto.speaking=false; autoSending=true;
  $("junTile").classList.remove("speaking");
  r.onstop=async()=>{
    const blob=new Blob(auto.chunks,{type:r.mimeType||auto.type||"audio/webm"});
    try{
      if(blob.size>2000){
        $("autoLabel").textContent="듣는 중...";
        const t=await transcribe(blob);
        $("autoLabel").textContent=auto.on?"자동 듣기 켜짐":"자동 듣기";
        if(t.text&&!NOISE.test(t.text.trim()))await send(t.text,t);
      }
    }catch(e){toast(e instanceof ApiError?e.message:"받아쓰기에 실패했어요. 다시 말해보세요.")}
    finally{autoSending=false;autoUI()}
  };
  try{r.stop()}catch(e){autoSending=false}
}
function autoLoop(t){
  if(!auto.on)return;
  auto.raf=requestAnimationFrame(autoLoop);
  const dt=auto.last?Math.min(100,t-auto.last):16; auto.last=t;
  const canListen=!busy&&!chain&&!recording&&!autoSending&&phase!=="idle";
  if(!canListen){if(auto.rec)autoDiscard();return}
  if(!auto.rec)autoStartSeg();
  const lv=autoLevel(), thr=Math.max(0.012,auto.floor*2.6);
  const age=performance.now()-auto.startedAt;
  if(!auto.speaking){
    if(lv<thr)auto.floor=auto.floor*0.97+lv*0.03;
    if(lv>thr){auto.speechMs+=dt;if(auto.speechMs>150){auto.speaking=true;auto.silenceMs=0;$("junTile").classList.add("speaking");stopAudio()}}
    else auto.speechMs=Math.max(0,auto.speechMs-dt);
    if(age>12000)autoDiscard();
  }else{
    if(lv<thr*0.8){auto.silenceMs+=dt;if(auto.silenceMs>1200)autoFinish()}
    else auto.silenceMs=0;
    if(auto.rec&&age>45000)autoFinish();
  }

const JULIA_DEFAULT=EMO.calm;
const PH={julia:{img:"juliaPhoto",ph:"juliaPh",btn:"juliaPhotoBtn",reset:"juliaPhotoReset",key:"oc_photo",name:"Julia"}};
let photoTarget="julia", camStream=null;
let customJulia=false, faceFront=null, curEmo="calm", emoTimer=0;
function setEmotion(key){
  if(customJulia||!EMO[key]||key===curEmo)return;
  curEmo=key; clearTimeout(emoTimer);
  const a=$("juliaPhoto"), b=$("juliaPhoto2");
  const front=faceFront||a, back=front===a?b:a;
  back.onload=()=>{back.style.opacity=1;front.style.opacity=0;faceFront=back};
  back.hidden=false; back.src=EMO[key];
  if(back.complete&&back.naturalWidth)back.onload();
}
function restEmotion(ms){clearTimeout(emoTimer);emoTimer=setTimeout(()=>setEmotion("calm"),ms)}
function showPhoto(who,src){
  const c=PH[who], img=$(c.img), bg=$(who+"Bg");
  if(who==="julia"){customJulia=!!src;$("juliaTile").classList.toggle("custom",customJulia);$("juliaPhoto2").style.opacity=0;img.style.opacity=1;faceFront=img;curEmo="calm"}
  if(src){img.src=src;img.hidden=false;$(c.ph).hidden=true;$(c.reset).hidden=false;$(c.btn).textContent=c.name+" 사진 바꾸기"}
  else if(who==="julia"){img.src=JULIA_DEFAULT;img.hidden=false;$(c.ph).hidden=true;$(c.reset).hidden=true;$(c.btn).textContent="Julia 사진 바꾸기"}
  else{img.hidden=true;img.removeAttribute("src");$(c.ph).hidden=!!(who==="jun"&&camStream);$(c.reset).hidden=true;$(c.btn).textContent=c.name+" 사진 넣기"}
  if(img.hidden){bg.hidden=true;bg.removeAttribute("src")}else{bg.src=img.src;bg.hidden=false}
}
$("juliaPh").innerHTML=AVATAR;
$("juliaPhotoBtn").onclick=()=>{photoTarget="julia";$("photoInput").click()};
$("photoInput").onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return; const who=photoTarget;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const url=c.toDataURL("image/jpeg",.85); showPhoto(who,url);
    if(!store(PH[who].key,url))toast("사진은 이번에만 적용됐어요. 저장 공간이 부족해요.");
  };im.src=rd.result};
  rd.readAsDataURL(f); e.target.value="";
};
$("juliaPhotoReset").onclick=()=>{try{localStorage.removeItem(PH.julia.key)}catch(e){};showPhoto("julia",null)};
showPhoto("julia",load(PH.julia.key,null));
$("camBtn").onclick=async()=>{
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;$("cam").hidden=true;$("camBtn").textContent="내 카메라 켜기";$("junPh").hidden=false;return}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});$("cam").srcObject=camStream;$("cam").hidden=false;$("junPh").hidden=true;$("junPhoto").hidden=true;$("junBg").hidden=true;$("camBtn").textContent="내 카메라 끄기"}
  catch(e){toast("카메라를 쓸 수 없어요. 브라우저의 카메라 권한을 허용해 주세요.")}
};

$("openSettings").onclick=openSettings;

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("settings").hidden)closeSettings()});
["juliaVoice","coachVoice"].forEach(id=>{$(id).innerHTML=VOICES.map(v=>`<option value="${v.id}">${v.label}</option>`).join("")});

keyState();
$("saveKey").onclick=()=>{cfg.key=$("apiKey").value.trim();saveCfg();keyState()};
$("apiKey").addEventListener("input",()=>{cfg.key=$("apiKey").value.trim();saveCfg();keyState()});
$("testKey").onclick=async()=>{
  cfg.key=$("apiKey").value.trim();saveCfg();
  const k=$("keyState"); k.className="tip"; k.textContent="확인 중이에요...";
  try{await api("models/"+encodeURIComponent(cfg.chat),{method:"GET"});k.className="tip ok";k.textContent="연결됐어요. 닫기를 누르고 통화 시작을 눌러보세요."}

$("chatModel").value=cfg.chat;$("ttsModel").value=cfg.tts;$("sttModel").value=cfg.stt;

function autosize(){if(!msg.value){msg.style.height="";return}msg.style.height="auto";msg.style.height=Math.min(msg.scrollHeight,120)+"px"}
msg.addEventListener("input",autosize);
msg.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("send").onclick=()=>send();
log.addEventListener("scroll",()=>{pinned=log.scrollHeight-log.scrollTop-log.clientHeight<80});
if(window.ResizeObserver)new ResizeObserver(()=>{if(pinned)scroll()}).observe(log);
$("micBtn").onclick=toggleMic;
$("autoBtn").onclick=toggleAuto;
$("skipAudio").onclick=()=>{stopAudio();$("skipAudio").disabled=true;closeMore()};
function closeMore(){$("moreMenu").hidden=true;$("moreBtn").setAttribute("aria-expanded","false")}
$("moreBtn").onclick=e=>{e.stopPropagation();const m=$("moreMenu");m.hidden=!m.hidden;$("moreBtn").setAttribute("aria-expanded",!m.hidden)};
document.addEventListener("click",e=>{if(!$("moreMenu").hidden&&!e.target.closest("#moreMenu"))closeMore()});
$("toggleKo").onclick=e=>{showKo=!showKo;e.currentTarget.textContent=showKo?"해석 끄기":"해석 켜기";closeMore();log.querySelectorAll(".ko-line").forEach(n=>n.hidden=!showKo);caption(lastJulia.en?{text:lastJulia.en,ko:lastJulia.ko,who:"julia"}:null)};
$("targetListen").onclick=()=>{if(pending&&!chain)playSeq([{text:pending.model,who:"coach"}])};
$("skipBtn").onclick=async()=>{if(chain)return;stopAudio();addCoach({say:"괜찮아요, 이번 건 넘어가요. 표현 노트에 넣어뒀어요."});setPhase("answer");await continueTalk()};
$("clearAll").onclick=()=>{patterns={};notes=[];store("oc_patterns",patterns);store("oc_notes",notes);renderSide()};

$("reloadBtn").onclick=()=>{try{stopAudio()}catch(e){};const u=location.pathname+"?v="+Date.now()+(location.hash||"");location.replace(u)};
$("openSide").onclick=()=>$("side").classList.add("open");
$("closeSide").onclick=()=>$("side").classList.remove("open");

/* Keep the layout inside the visible screen (iPhone keyboard) and keep the chat pinned to the newest message */
(function(){
  const vv=window.visualViewport, root=document.documentElement; let baseH=0, kbOn=false;
  const pin=()=>{if(window.scrollY||document.documentElement.scrollTop||document.body.scrollTop){window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}};
  function fit(){
    const h=Math.round(vv?vv.height:window.innerHeight);
    const focused=document.activeElement===msg;
    if(!focused)baseH=Math.max(baseH,h);
    const kb=focused&&(h<baseH*0.8||window.innerHeight-h>140);
    root.style.setProperty("--appH",h+"px");
    if(kb!==kbOn){kbOn=kb;document.body.classList.toggle("kb",kb)}
    pin(); if(pinned)requestAnimationFrame(scroll);
  }
  if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",pin)}
  window.addEventListener("scroll",pin,{passive:true});
  window.addEventListener("resize",fit); window.addEventListener("orientationchange",()=>{baseH=0;setTimeout(fit,300)}); fit();
  msg.addEventListener("focus",()=>{pin();fit();setTimeout(fit,150);setTimeout(fit,400)});
  msg.addEventListener("input",pin);
  msg.addEventListener("blur",()=>{setTimeout(fit,200)});
})();
/* Opening screen */
lastJulia={en:OPENERS.daily[0],ko:OPENERS.daily[1]};
caption({text:OPENERS[$("topic").value][0],who:"julia"});

renderSide();
if(cfg.key)startTalk(true);
log.prepend(addCoach({say:"안녕하세요, 코치 Sam이에요. Julia랑 친구처럼 편하게 영어로 얘기하세요. 막히면 한국어로 말해도 되고, 궁금한 게 있으면 왜 이렇게 말해요? 처럼 언제든 저한테 물어보세요. 맞게 말하면 저는 조용히 있고, 더 자연스러운 표현이 있을 때만 알려드릴게요."}));
if(!cfg.key)openSettings();
